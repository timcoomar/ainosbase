<!doctype html>
<html lang="{{ site:short_locale }}">
    <head>
        <meta charset="utf-8">
        <meta http-equiv="X-UA-Compatible" content="IE=edge">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <title>{{ site:name }} | {{ title ?? site:name }}</title>
        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <link
            href="https://fonts.googleapis.com/css2?family=Alegreya+Sans:ital,wght@0,400;0,700;1,400&family=Manrope:wght@400;700&family=Sofia+Sans:ital,wght@0,100;0,400;0,700;1,100;1,400;1,700&display=swap"
            rel="stylesheet"
        />

        {{ vite src="resources/js/site.js|resources/css/site.scss" }}
        {{ livewire:styles }}

        <script>
            // Apply persisted user preferences before paint to avoid FOUC.
            //  - font choice: sets the --ainos-font CSS custom property on :root
            //  - lyrics view: sets data-lyrics-view on <body> so the show page
            //    renders the right lyrics immediately (Greek / English / Both)
            //  - text scale: sets the --text-scale CSS custom property on :root,
            //    which the body font-size calc multiplies through. Slides are
            //    unaffected (present.blade.php doesn't load layout.antlers.html,
            //    so the inline script never runs there — scale stays at default 1)
            (function () {
                var FONTS = {
                    'sofia-sans':    "'Sofia Sans', sans-serif",
                    'manrope':       "'Manrope', sans-serif",
                    'alegreya-sans': "'Alegreya Sans', sans-serif"
                };
                try {
                    var key = localStorage.getItem('ainos_font');
                    var stack = FONTS[key] || null;
                    if (stack) {
                        document.documentElement.style.setProperty('--ainos-font', stack);
                    }
                } catch (e) { /* localStorage unavailable — silently fall back to default */ }

                try {
                    var view = localStorage.getItem('ainos_lyrics_view');
                    if (view === 'greek' || view === 'english' || view === 'both') {
                        document.documentElement.setAttribute('data-lyrics-view', view);
                    } else {
                        document.documentElement.setAttribute('data-lyrics-view', 'greek');
                    }
                } catch (e) {
                    document.documentElement.setAttribute('data-lyrics-view', 'greek');
                }

                try {
                    var scale = parseFloat(localStorage.getItem('ainos_text_scale'));
                    // Allow only the three sanctioned values; anything else falls back to 1.
                    if (scale === 0.9 || scale === 1 || scale === 1.2) {
                        document.documentElement.style.setProperty('--text-scale', String(scale));
                    }
                } catch (e) { /* keep default --text-scale: 1 from stylesheet */ }
            })();
        </script>
    </head>
    <body class="page-{{ template or slug or 'home' }}">
        <div>
            {{ template_content }}
        </div>
        {{ livewire:scripts }}
    </body>

</html>
